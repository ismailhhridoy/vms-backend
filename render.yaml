services:
  - type: web
    name: vms-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.netlify.app,http://localhost:3000"
      - key: DB_URL
        fromDatabase:
          name: vms-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: vms-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vms-db
          property: password

databases:
  - name: vms-db
    databaseName: vms_db
    user: vms_user
    plan: free
    region: oregon
