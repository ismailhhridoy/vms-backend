spring:
  application:
    name: vms-backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:8000"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:8000"

