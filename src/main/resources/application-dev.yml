spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vms_db}
    username: ${DB_USERNAME:vms_user}
    password: ${DB_PASSWORD:vms_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.starkgroup.vms: DEBUG
    org.springframework.web: INFO

