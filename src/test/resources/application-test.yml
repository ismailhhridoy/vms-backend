spring:
  datasource:
    url: jdbc:h2:mem:vms_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    # H2Dialect is auto-detected by Hibernate 6 — no need to specify it explicitly

